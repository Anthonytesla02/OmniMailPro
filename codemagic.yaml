# codemagic.yaml
# Production CI/CD workflow for OmniMail Expo App (Android APK/AAB & iOS IPA)
# Documentation: https://docs.codemagic.io/yaml-quick-start/

workflows:
  expo-android-release:
    name: OmniMail Expo Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22.14.0
      java: 17
      groups:
        - google_play # Defined in Codemagic environment variables
      vars:
        PACKAGE_NAME: "com.omnimail.business"
        EXPO_PUBLIC_API_URL: "https://api.omnimail.app"
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: Install dependencies & align Expo SDK versions
        script: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps
          npx expo install --fix
      - name: Expo Prebuild (Generate Native Android Project)
        script: |
          npx expo prebuild --platform android --clean
      - name: Set Android SDK Location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android Release APK & AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      - android/app/build/outputs/bundle/release/*.aab
    publishing:
      email:
        recipients:
          - buybesttraffic@gmail.com
        notify:
          success: true
          failure: true

  expo-ios-release:
    name: OmniMail Expo iOS Release (IPA)
    max_build_duration: 90
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: ad_hoc # or app_store
        bundle_identifier: com.omnimail.business
      vars:
        BUNDLE_ID: "com.omnimail.business"
        XCODE_WORKSPACE: "ios/OmniMail.xcworkspace"
        XCODE_SCHEME: "OmniMail"
      node: 22.14.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
    scripts:
      - name: Install dependencies & align Expo SDK versions
        script: |
          npm config set legacy-peer-deps true
          npm install --legacy-peer-deps
          npx expo install --fix
      - name: Expo Prebuild for iOS
        script: |
          npx expo prebuild --platform ios --clean
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - buybesttraffic@gmail.com
        notify:
          success: true
          failure: true
